apiVersion: apps/v1
kind: Deployment
metadata:
  name: rommie-backend
  namespace: rommie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rommie-backend
  template:
    metadata:
      labels:
        app: rommie-backend
    spec:
      containers:
      - name: backend
        image: pratapad/rommie-backend:51f6734cd649da542e4a0d0438e59808399b3e74
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: rommie-backend-svc
  namespace: rommie
spec:
  selector:
    app: rommie-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP